[workspace]

[package]
name = "dukascopy-data-downloader"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Download raw Dukascopy historical kline (.bi5) files from the public Datafeed."
license = "MIT"

[lib]
name = "ddd"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Narrow feature set: rt-multi-thread (#[tokio::main]), macros (#[tokio::test]),
# fs (tokio::fs), time (test sleeps), sync (Semaphore download gate).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
backoff = { version = "0.4", features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = false
strip = "symbols"
