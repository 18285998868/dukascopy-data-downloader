[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/dukascopy-data-downloader-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }

tempfile = "3"
wiremock = "0.6"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"