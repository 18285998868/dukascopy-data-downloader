# 配置说明: 全部字段以小写字母开头; 未知键会被拒收(拼错即报错)
#
# 目录约定 (重要): output_dir 是数据**根目录**, 程序会自动在其下追加
#   dukascopy/{symbol}/{YYYY}[/{MM}[/{DD}]]/{price}_candles_*.bi5
# 因此不要把 dukascopy 写进 output_dir, 否则会生成重复的嵌套目录:
#   错误: output_dir = "/data/dukascopy"
#         → /data/dukascopy/dukascopy/...
#   正确: output_dir = "/data"
#         → /data/dukascopy/...
#
symbol = ["EURUSD"] # 交易品种列表, 必填; 只允许 3..=20 位大写 ASCII 字母与数字, 会在 URL 与本地路径中原样使用; 自动排序去重
timeframe = ["D1"] # K线周期, 必填, 可选参数: ["M1","H1","D1","1m","1h","1d"]; 别名归一(1m≡M1); 自动排序去重
# price_type = "BID" # 报价类型, 可选, 默认值: "BID", 可选参数: ["BID","ASK"]
# start = "2020-01-01" # 起始日期, 可选, 默认值: 2020-01-01, 格式 YYYY-MM-DD
# end = "2025-12-31" # 截止日期, 可选, 默认值: 昨天, 未来值自动截到昨天, 格式 YYYY-MM-DD
# output_dir = "data" # 数据根目录(不含 dukascopy), 可选, 默认值: "data", 任意目录路径
# concurrency = 30 # **全局**最大并发下载数(所有 symbol×timeframe 组合共享, 不是每 pair 各算一份), 可选, 默认值: 30, 取值 1..=256
#
# 注意: 生效区间 = [start, min(end, 昨天)], 超过 15 年(366×15 天)会直接报错退出。
