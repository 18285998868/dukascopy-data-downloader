# 配置说明: 全部字段以小写字母开头 (冒烟: 1 symbol × D1 × 2025年, 输出到 /tmp)
symbol = ["EURUSD"] # 交易品种列表, 必填
timeframe = ["D1"] # K线周期, 必填, 可选参数: ["M1","H1","D1","1m","1h","1d"]
# price_type = "BID" # 报价类型, 可选, 默认值: "BID", 可选参数: ["BID","ASK"]
start = "2025-01-01" # 起始日期, 可选, 默认值: 无, 可选参数: YYYY-MM-DD
end = "2025-01-31" # 截止日期, 可选, 默认值: 昨天, 可选参数: YYYY-MM-DD
output_dir = "/tmp/dukascopy-smoke" # 数据根目录(不含 dukascopy), 可选, 默认值: "data"
# concurrency = 30 # **全局**最大并发下载数(所有 symbol×timeframe 组合共享, 不是每 pair 各算一份), 可选, 默认值: 30
